<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Repo Analyzer</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700;0,9..40,800&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f8f5f0;
    color: #2d2a26;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 20px;
  }

  h1 {
    font-size: 1.85rem;
    font-weight: 800;
    margin-bottom: 28px;
    letter-spacing: -0.03em;
    color: #2d2a26;
  }

  h1 .accent { color: #e05a33; }

  /* --- Search bar --- */
  .search-bar {
    display: flex;
    gap: 10px;
    width: 100%;
    max-width: 560px;
    margin-bottom: 36px;
  }

  .search-bar input {
    flex: 1;
    padding: 14px 18px;
    font-family: inherit;
    font-size: 0.95rem;
    border: 2px solid #ddd5ca;
    border-radius: 14px;
    outline: none;
    background: #fff;
    color: #2d2a26;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .search-bar input::placeholder { color: #b0a898; }
  .search-bar input:focus {
    border-color: #e05a33;
    box-shadow: 0 0 0 3px rgba(224, 90, 51, 0.12);
  }

  .search-bar button {
    padding: 14px 28px;
    font-family: inherit;
    font-size: 0.95rem;
    font-weight: 700;
    border: none;
    border-radius: 14px;
    background: #e05a33;
    color: #fff;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.2s, transform 0.1s;
  }

  .search-bar button:hover { background: #c94e2b; transform: translateY(-1px); }
  .search-bar button:active { transform: translateY(0); }
  .search-bar button:disabled { background: #dbc3b5; cursor: not-allowed; transform: none; }

  /* --- Loading --- */
  .loader {
    display: none;
    margin: 40px 0;
    text-align: center;
    color: #8a7e72;
    font-size: 0.95rem;
    font-weight: 600;
  }

  .loader .spinner {
    width: 34px;
    height: 34px;
    border: 3.5px solid #e8e0d6;
    border-top-color: #e05a33;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin: 0 auto 14px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* --- Error --- */
  .error-msg {
    display: none;
    max-width: 560px;
    width: 100%;
    padding: 14px 18px;
    background: #fef2f0;
    border: 1.5px solid #f0a898;
    border-radius: 14px;
    color: #b33a1a;
    font-size: 0.9rem;
    font-weight: 500;
    margin-bottom: 24px;
    line-height: 1.45;
  }

  /* --- Results --- */
  .results {
    display: none;
    width: 100%;
    max-width: 900px;
  }

  .results-header {
    text-align: center;
    margin-bottom: 32px;
  }

  .repo-name {
    font-size: 1.1rem;
    font-weight: 600;
    color: #6b6259;
    margin-bottom: 16px;
    letter-spacing: -0.01em;
  }

  /* --- Ring gauge --- */
  .ring-wrap {
    position: relative;
    width: 150px;
    height: 150px;
    margin: 0 auto;
  }

  .ring-wrap svg {
    transform: rotate(-90deg);
    width: 150px;
    height: 150px;
  }

  .ring-bg {
    fill: none;
    stroke: #e8e0d6;
    stroke-width: 10;
  }

  .ring-fill {
    fill: none;
    stroke-width: 10;
    stroke-linecap: round;
    transition: stroke-dashoffset 0.8s ease, stroke 0.3s ease;
  }

  .ring-text {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .ring-score {
    font-size: 2.4rem;
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1;
  }

  .ring-label {
    font-size: 0.8rem;
    font-weight: 600;
    color: #a09585;
    margin-top: 2px;
  }

  /* hide the old text-only score (still populated by JS for data) */
  .total-score { display: none; }

  /* --- Cards --- */
  .cards {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
  }

  @media (max-width: 700px) {
    .cards { grid-template-columns: 1fr; }
  }

  .card {
    background: #fff;
    border-radius: 18px;
    padding: 22px 22px 22px 26px;
    box-shadow: 0 2px 8px rgba(45, 42, 38, 0.06);
    border-left: 5px solid transparent;
    transition: box-shadow 0.2s;
  }

  .card:hover {
    box-shadow: 0 4px 16px rgba(45, 42, 38, 0.10);
  }

  #cardCommits  { border-left-color: #8b5cf6; }
  #cardIssues   { border-left-color: #f06449; }
  #cardMetadata { border-left-color: #2bbaa0; }

  .card-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 4px;
  }

  .card-icon {
    width: 20px;
    height: 20px;
    flex-shrink: 0;
  }

  #cardCommits  .card-icon { color: #8b5cf6; }
  #cardIssues   .card-icon { color: #f06449; }
  #cardMetadata .card-icon { color: #2bbaa0; }

  .card-title {
    font-size: 0.78rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: #9a9088;
  }

  .card-subtotal {
    font-size: 1.5rem;
    font-weight: 800;
    margin-bottom: 18px;
    letter-spacing: -0.02em;
  }

  .card-subtotal span { color: #c4b9ad; font-weight: 500; font-size: 0.95rem; }

  /* --- Signal rows --- */
  .signal {
    margin-bottom: 14px;
  }

  .signal:last-child { margin-bottom: 0; }

  .signal-label {
    display: flex;
    justify-content: space-between;
    font-size: 0.82rem;
    margin-bottom: 5px;
    color: #6b6259;
  }

  .signal-label .score-text { font-weight: 700; color: #2d2a26; }

  .bar-track {
    width: 100%;
    height: 8px;
    background: #ece6dd;
    border-radius: 4px;
    overflow: hidden;
  }

  .bar-fill {
    height: 100%;
    border-radius: 4px;
    transition: width 0.5s ease;
  }

  .bar-green  { background: #34c759; }
  .bar-amber  { background: #f5a623; }
  .bar-red    { background: #ef4444; }
</style>
</head>
<body>

<h1>Repo <span class="accent">Analyzer</span></h1>

<div class="search-bar">
  <input type="text" id="repoInput" placeholder="https://github.com/owner/repo" />
  <button id="analyzeBtn">Analyze</button>
</div>

<div class="error-msg" id="errorMsg"></div>

<div class="loader" id="loader">
  <div class="spinner"></div>
  Analyzing repository…
</div>

<div class="results" id="results">
  <div class="results-header">
    <div class="repo-name" id="repoName"></div>
    <!-- Ring gauge -->
    <div class="ring-wrap" id="ringWrap">
      <svg viewBox="0 0 150 150">
        <circle class="ring-bg" cx="75" cy="75" r="60"></circle>
        <circle class="ring-fill" id="ringFill" cx="75" cy="75" r="60"
                stroke-dasharray="376.99"
                stroke-dashoffset="376.99"></circle>
      </svg>
      <div class="ring-text">
        <div class="ring-score" id="ringScore">0</div>
        <div class="ring-label">/ 100</div>
      </div>
    </div>
    <!-- hidden, still populated by showResults -->
    <div class="total-score" id="totalScore"></div>
  </div>
  <div class="cards">
    <div class="card" id="cardCommits">
      <div class="card-header">
        <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><line x1="1.05" y1="12" x2="7" y2="12"/><line x1="17.01" y1="12" x2="22.96" y2="12"/></svg>
        <div class="card-title">Commits</div>
      </div>
      <div class="card-subtotal" id="subtotalCommits"></div>
      <div id="signalsCommits"></div>
    </div>
    <div class="card" id="cardIssues">
      <div class="card-header">
        <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <div class="card-title">Issues</div>
      </div>
      <div class="card-subtotal" id="subtotalIssues"></div>
      <div id="signalsIssues"></div>
    </div>
    <div class="card" id="cardMetadata">
      <div class="card-header">
        <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
        <div class="card-title">Metadata</div>
      </div>
      <div class="card-subtotal" id="subtotalMetadata"></div>
      <div id="signalsMetadata"></div>
    </div>
  </div>
</div>

<script>
  const CARDS = {
    commits: {
      subtotalEl: "subtotalCommits",
      signalsEl: "signalsCommits",
      signals: [
        { key: "recency",   label: "Recency",   max: 13 },
        { key: "frequency", label: "Frequency", max: 12 },
        { key: "momentum",  label: "Momentum",  max: 8  },
      ]
    },
    issues: {
      subtotalEl: "subtotalIssues",
      signalsEl: "signalsIssues",
      signals: [
        { key: "issue_engagement", label: "Engagement",      max: 10 },
        { key: "resolution_rate",  label: "Resolution rate", max: 13 },
        { key: "time_to_close",    label: "Time to close",   max: 10 },
      ]
    },
    metadata: {
      subtotalEl: "subtotalMetadata",
      signalsEl: "signalsMetadata",
      signals: [
        { key: "fork_ratio",      label: "Fork ratio",       max: 11 },
        { key: "license",         label: "License",          max: 6  },
        { key: "recent_releases", label: "Recent releases",  max: 11 },
        { key: "readme",          label: "Readme",           max: 6  },
      ]
    }
  };

  function barColor(score, max) {
    const pct = score / max;
    if (pct >= 0.7) return "bar-green";
    if (pct >= 0.4) return "bar-amber";
    return "bar-red";
  }

  function renderSignal(container, label, score, max) {
    const pct = Math.round((score / max) * 100);
    const color = barColor(score, max);
    const div = document.createElement("div");
    div.className = "signal";
    div.innerHTML = `
      <div class="signal-label">
        <span>${label}</span>
        <span class="score-text">${score} / ${max}</span>
      </div>
      <div class="bar-track">
        <div class="bar-fill ${color}" style="width: ${pct}%"></div>
      </div>`;
    container.appendChild(div);
  }

  /* Ring gauge update — purely visual, uses the same color thresholds */
  function updateRing(score) {
    const CIRCUMFERENCE = 2 * Math.PI * 60; // r=60
    const offset = CIRCUMFERENCE - (score / 100) * CIRCUMFERENCE;
    const ring = document.getElementById("ringFill");
    ring.style.strokeDashoffset = offset;

    const pct = score / 100;
    if (pct >= 0.7) ring.style.stroke = "#34c759";
    else if (pct >= 0.4) ring.style.stroke = "#f5a623";
    else ring.style.stroke = "#ef4444";

    document.getElementById("ringScore").textContent = score;
  }

  function showResults(data) {
    const b = data.breakdown;

    document.getElementById("repoName").textContent = data.owner + " / " + data.repo;
    document.getElementById("totalScore").innerHTML = data.total_score + " <span>/ 100</span>";

    for (const [, card] of Object.entries(CARDS)) {
      const container = document.getElementById(card.signalsEl);
      container.innerHTML = "";
      let subtotal = 0;
      let subtotalMax = 0;
      for (const s of card.signals) {
        const score = b[s.key] ?? 0;
        subtotal += score;
        subtotalMax += s.max;
        renderSignal(container, s.label, score, s.max);
      }
      document.getElementById(card.subtotalEl).innerHTML = subtotal + " <span>/ " + subtotalMax + "</span>";
    }

    updateRing(data.total_score);
    document.getElementById("results").style.display = "block";
  }

  async function analyze() {
    const input = document.getElementById("repoInput");
    const btn = document.getElementById("analyzeBtn");
    const loader = document.getElementById("loader");
    const errorEl = document.getElementById("errorMsg");
    const resultsEl = document.getElementById("results");

    const url = input.value.trim();
    if (!url) { input.focus(); return; }

    // Reset UI
    errorEl.style.display = "none";
    resultsEl.style.display = "none";
    loader.style.display = "block";
    btn.disabled = true;

    try {
      const res = await fetch("/analyze", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ repo_url: url })
      });

      if (!res.ok) {
        let msg = "Something went wrong (HTTP " + res.status + ")";
        try {
          const body = await res.json();
          if (body.detail) msg = body.detail;
        } catch {}
        throw new Error(msg);
      }

      const data = await res.json();
      showResults(data);
    } catch (err) {
      errorEl.textContent = err.message;
      errorEl.style.display = "block";
    } finally {
      loader.style.display = "none";
      btn.disabled = false;
    }
  }

  document.getElementById("analyzeBtn").addEventListener("click", analyze);
  document.getElementById("repoInput").addEventListener("keydown", (e) => {
    if (e.key === "Enter") analyze();
  });
</script>

</body>
</html>
